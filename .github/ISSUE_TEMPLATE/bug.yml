name: Bug report
description: Something is broken in the runtime scaffold or a later build.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not upload original game files.
  - type: textarea
    id: summary
    attributes:
      label: What happened
      placeholder: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ./gradlew test
        2. ...
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Module
      placeholder: game-logic / runtime-pc / runtime-android / docs / ci
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and JDK
      placeholder: Windows 11, JDK 17
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
